<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="soccer-note-standalone" content="1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="サッカーノート">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#eceff6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#090d18" media="(prefers-color-scheme: dark)">
<meta name="format-detection" content="telephone=no">
<meta name="robots" content="noindex,nofollow">
<title>ぼくのサッカーノート</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Layout: phone = one column (player card, then panels). iPad and wider = player card pinned on the left, panels on the right. Tab bar fixed to the bottom. */
:root{
  --bg:#eceff6; --paper:#ffffff; --ink:#141a2e; --muted:#5a6480; --rule:#d3d9e8;
  --accent:#ffc928; --accent-ink:#3a2c00; --accent-text:#8a6800; --kick:#e8501f; --on:#ffffff;
  --good:#2f6fe4; --soft:#e3e9fb; --chip:#f2f5fc; --bond:#d93a74; --bond-soft:#fde6ee; --msn:#6c44c8; --msn-soft:#efe8fd; --fire:#b53d0c;
  --display:"Dela Gothic One","Hiragino Sans","Noto Sans JP",sans-serif;
  --body:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#090d18; --paper:#121a2e; --ink:#e8ecf8; --muted:#98a3bf; --rule:#27314f;
  --accent:#ffd34f; --accent-ink:#2a2000; --accent-text:#ffd34f; --kick:#ff875f; --on:#160b05;
  --good:#73a2ff; --soft:#1a2545; --chip:#161f38; --bond:#ff7aa8; --bond-soft:#3a1626; --msn:#b99bff; --msn-soft:#261d42; --fire:#ff9b70; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#090d18; --paper:#121a2e; --ink:#e8ecf8; --muted:#98a3bf; --rule:#27314f;
  --accent:#ffd34f; --accent-ink:#2a2000; --accent-text:#ffd34f; --kick:#ff875f; --on:#160b05;
  --good:#73a2ff; --soft:#1a2545; --chip:#161f38; --bond:#ff7aa8; --bond-soft:#3a1626; --msn:#b99bff; --msn-soft:#261d42; --fire:#ff9b70; color-scheme:dark}
html,body{background:var(--bg);color:var(--ink)}
/* Paints the strip under the status bar, so the page does not show through it while it scrolls past the pinned card. */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
body{font-family:var(--body);font-size:16px;line-height:1.6}
*{box-sizing:border-box}
[hidden]{display:none!important}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 170px;display:flex;flex-direction:column;gap:16px}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.02em}
h2{font-size:1.15rem}
h3{font-size:1rem}
p{margin:0}
.panel{background:var(--paper);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px;border:1px solid var(--rule)}
.muted{color:var(--muted);font-size:.88rem}
.banner{font-size:.82rem;background:var(--soft);border-radius:12px;padding:8px 12px;color:var(--muted)}
#view{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row2{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.label{font-size:.75rem;letter-spacing:.08em;font-weight:800}
.b{display:block;height:10px;background:var(--soft);border-radius:999px;overflow:hidden}
.b i{display:block;height:100%;background:var(--good);border-radius:999px}
.b.bond i{background:var(--bond)}

/* player card */
.card{--team:#2f7bff;position:relative;border-radius:10px 26px 10px 26px;overflow:hidden;background:linear-gradient(135deg,#070b18 0%,#141d3d 55%,#070b18 100%);color:#fff;padding:12px 16px 12px 6px;display:grid;grid-template-columns:minmax(0,40%) 1fr;gap:8px;align-items:center;border:1px solid color-mix(in srgb,var(--team) 60%,#070b18)}
.card::before{content:"";position:absolute;inset:0;background:
  linear-gradient(115deg,transparent 0 58%,color-mix(in srgb,var(--team) 70%,transparent) 58% 59.5%,transparent 59.5% 64%,color-mix(in srgb,var(--team) 35%,transparent) 64% 64.8%,transparent 64.8%),
  repeating-linear-gradient(115deg,rgba(255,255,255,.04) 0 2px,transparent 2px 16px);pointer-events:none}
.card>*{position:relative}
.card .fig svg{width:100%;height:auto;display:block}
.card .who{display:flex;flex-direction:column;gap:6px;min-width:0;align-self:end}
.tags{display:flex;gap:6px;flex-wrap:wrap;padding-right:64px}
.rank,.posb{display:inline-flex;font-weight:800;font-size:.8rem;padding:2px 12px;border-radius:3px;transform:skewX(-10deg)}
.rank{background:#ffd34f;color:#2a2000}
.posb{background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.4)}
.pname{font-family:var(--display);font-size:1.4rem;line-height:1.2;word-break:break-all}
.lv{font-family:var(--display);font-size:2.4rem;line-height:1;transform:skewX(-8deg);transform-origin:left bottom;text-shadow:0 0 14px var(--team)}
.lv small{font-size:1rem;margin-right:4px}
.xpbar{height:12px;border-radius:3px;background:rgba(255,255,255,.14);overflow:hidden;transform:skewX(-10deg)}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--team),#ffd34f);transition:width .8s ease}
.xptext{font-size:.8rem;opacity:.9;font-variant-numeric:tabular-nums}
.unlock{font-size:.82rem;color:#fff;opacity:.9}.unlock b{color:#ffd34f}
.gear{position:absolute;top:10px;right:10px;background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:999px;padding:4px 10px;font-size:.8rem}
.zoom{grid-column:2;justify-self:start;align-self:start;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:999px;padding:7px 14px;font-size:.82rem;font-weight:800}
.card .fig{grid-row:1/span 2;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
@media (max-width:400px){.lv{font-size:2rem}.pname{font-size:1.2rem}.rank{padding:2px 8px}}
.rank{white-space:nowrap} /* v13: a five-letter title (たまご選手, レジェンド) stays on one line on a 320px phone */
@media (prefers-reduced-motion:no-preference){
  .pxf1,.pxf2,.pxf2s{animation:pxa .6s steps(1,end) infinite}.pxf2,.pxf2s{animation-delay:-.3s}@keyframes pxa{0%{opacity:1}50%,100%{opacity:0}}}
.pxf2{opacity:0} /* pixel pictures: aura tips and lightning switch between two frames; with reduced motion the first frame stays */
/* .pxf2s is a second frame that stays visible with reduced motion (the Lv.35 bolts): it has no hide rule */
@media (min-width:760px){
  /* The room kept free under the page for the tab bar is split in two: 76px under the grid, so the pinned card can stay put down to the end of the page, and the rest under the panels. */
  .wrap{max-width:1040px;display:grid;grid-template-columns:minmax(280px,340px) minmax(0,1fr);align-items:start;gap:20px;padding-bottom:76px}
  .col{padding-bottom:94px}
  .card{grid-template-columns:1fr;padding:12px 18px 18px}
  .card .fig{width:100%;max-width:290px;margin:0 auto;grid-row:auto}
  .card .who{align-self:auto}
  .zoom{position:absolute;top:10px;left:10px;grid-column:auto;padding:6px 12px}
  /* The card is pinned, so the figure shrinks until the whole card fits above the tab bar. --whoh is the height of the text block, measured by fitCard(). */
  .card .fig svg{max-height:54vh;max-height:min(54vh,max(180px,calc(100dvh - var(--whoh,253px) - 128px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))))}
  .pname{font-size:1.6rem}
}
/* Pinned only when the screen is tall enough for the whole card; on a low screen it scrolls with the page. */
@media (min-width:760px) and (min-height:570px){.card{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}}

.nextgoal{background:var(--accent);color:var(--accent-ink);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.nextgoal b{font-size:1.15rem}
.ticket{background:var(--paper);border:2px solid var(--kick);border-radius:18px;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.ticket b{font-family:var(--display);font-size:1.3rem;margin-left:8px;color:var(--kick)}

/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;align-items:center}
.stats svg{width:100%;max-width:330px;height:auto;display:block;margin:0 auto}
.statlist{display:flex;flex-direction:column;gap:6px;font-size:.9rem}
.statlist div{display:grid;grid-template-columns:6.2em 1fr 2.2em;gap:6px;align-items:center}
.statlist em{font-style:normal;text-align:right;font-variant-numeric:tabular-nums;font-weight:800}

/* skills */
.skills{display:flex;flex-wrap:wrap;gap:8px}
.sk{display:inline-flex;font-weight:800;font-size:.85rem;padding:4px 12px;border-radius:4px;background:var(--good);color:var(--on);transform:skewX(-8deg)}
.sk.gold{background:var(--accent);color:var(--accent-ink)}
.soon{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.soon>div{display:flex;flex-direction:column;gap:4px}
.more summary{cursor:pointer;font-weight:800;color:var(--good);padding:4px 0}
.sklist{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px 12px;margin-top:8px}
.sklist>div{display:flex;flex-direction:column;border-left:4px solid var(--rule);padding-left:8px;line-height:1.4}
.sklist>div.on{border-color:var(--good)}
.sklist>div.gold{border-color:var(--accent)}
.sidetip{margin:12px 0 0;background:var(--soft);border-radius:12px;padding:8px 12px;line-height:1.5}
.sidetip b{display:block;font-size:.85rem;color:var(--good)}
.eyedot{display:inline-block;width:.8em;height:.8em;border-radius:50%;margin-right:6px;box-shadow:0 0 0 2px var(--paper),0 0 0 3px var(--rule)}
.eyedot.two{box-shadow:inset .4em 0 0 var(--eye1),0 0 0 2px var(--paper),0 0 0 3px var(--rule)} /* Lv.40: red and gold, split down the middle */

/* form */
.field{display:flex;flex-direction:column;gap:8px}
.field>.q{font-weight:800}
.field>.q small{font-weight:400;color:var(--muted);margin-left:6px}
.seg,.chips{display:flex;flex-wrap:wrap;gap:8px}
.seg button,.chips button{border:2px solid var(--rule);background:var(--chip);border-radius:999px;padding:8px 14px;font-weight:700;font-size:.95rem}
.seg button[aria-pressed="true"],.chips button[aria-pressed="true"]{border-color:var(--good);background:var(--good);color:var(--on)}
.chips.team button[aria-pressed="true"]{border-color:var(--bond);background:var(--bond)}
.chips button:disabled{opacity:.45}
.grp{font-size:.82rem;font-weight:800;display:flex;align-items:center;gap:6px}
.grp i{width:10px;height:10px;border-radius:50%;background:var(--good);display:inline-block}
.grp.team i{background:var(--bond)}
.chiphint{margin:6px 0 0;font-size:.8rem}
/* the group lines and the hint break only at spaces */
.grp,.chiphint{word-break:keep-all;overflow-wrap:break-word;overflow-wrap:anywhere}
.faces{display:flex;gap:6px}
.faces button{flex:1;border:2px solid var(--rule);background:var(--chip);border-radius:14px;padding:6px 0;font-size:1.5rem;line-height:1.2}
.faces button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent)}
input[type=text],input[type=date],textarea{width:100%;border:2px solid var(--rule);background:var(--paper);border-radius:12px;padding:10px 12px;font-size:1rem}
textarea{min-height:76px;resize:vertical}
.primary{border:0;background:var(--kick);color:var(--on);font-family:var(--display);font-size:1.15rem;border-radius:16px;padding:14px;letter-spacing:.05em}
.primary:disabled{opacity:.45}
.ghost{border:2px solid var(--rule);background:transparent;border-radius:12px;padding:8px 12px;font-weight:700}
/* backup, for parents (inside the settings panel) */
.bk{display:flex;flex-direction:column;gap:10px;padding-top:8px}
.bk h3{font-family:var(--body);font-weight:800;font-size:.95rem;letter-spacing:0}
.bk .row>.ghost{flex:1 1 10em;text-align:center}
.bk .pick{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.bk .pick input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.bk .pick:focus-within{outline:3px solid var(--accent);outline-offset:2px}
#bk-show{min-height:90px;font-size:.78rem;line-height:1.4;word-break:break-all}
#bk-code{min-height:90px;word-break:break-all}
.bkbox{border:2px solid var(--accent);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.bkbox ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px}
.bkmsg{font-weight:800}
.xpprev{font-size:.85rem;color:var(--muted);text-align:center}
.formmsg{font-weight:800;color:var(--kick);text-align:center}
/* v9 note items */
.write h3.sec,.msf h3.sec{font-family:var(--body);font-weight:800;font-size:.8rem;letter-spacing:.14em;color:var(--muted);border-top:2px dashed var(--rule);padding-top:12px}
.gamerow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.gamerow>input{flex:1 1 9em;min-width:0}
.gamerow .sc{display:flex;align-items:center;gap:6px;flex:none}
.gamerow input.num{width:3.4em;text-align:center;font-variant-numeric:tabular-nums}
.chips .star{color:var(--kick);margin-right:3px}
.chips button[aria-pressed="true"] .star{color:var(--accent)}
.chips.focus button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.ghost.mini{padding:2px 10px;font-size:.85rem;margin-left:6px;border-radius:10px}
.note .wx{margin-left:8px;font-weight:700;font-size:.9rem;color:var(--muted)}
.hint{margin-top:-4px}
.seg[data-seg="weather"]{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.seg[data-seg="weather"] button{padding:8px 4px;white-space:nowrap}
.goalcard{border:2px solid var(--accent)}
.goalcard .gc-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.goalcard .gc-head .label{color:var(--accent-text)}
.goalcard .gc-t{font-size:1.25rem;line-height:1.45}
.goalcard .gc-tip{font-size:.85rem;color:var(--muted);margin:0}
.goalcard .gc-own{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.goalcard .gc-own input{flex:1 1 12em;min-width:0}
.goalcard .gc-top{display:flex;flex-wrap:wrap;gap:2px 14px;align-items:baseline;font-size:.92rem;border-top:1px dashed var(--rule);padding-top:8px}
.goalcard .gc-top .label{color:var(--muted);flex-basis:100%}
.goalcard .gc-top b{color:var(--good)}
.stampnews{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;text-align:left;background:var(--paper);color:var(--ink);border:2px dashed var(--kick);border-radius:18px;padding:12px 16px;font:inherit;font-weight:800;cursor:pointer}
.stampnews small{font-weight:600;color:var(--muted)}
.stampnews.handnote{border-color:var(--good)}
#gcEdit,.cal-head button,[data-stampopen]{min-height:44px;min-width:44px}
.handoff{display:flex;flex-direction:column;gap:8px;border:2px solid var(--good);border-radius:14px;padding:10px 12px}
.handoff-ask{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;justify-content:center;border:2px dashed var(--good);border-radius:16px;padding:6px 10px}
.handoff-ask .ghost{min-height:44px}
.stamps{display:flex;flex-wrap:wrap;gap:6px}
.stamp{display:inline-flex;align-items:center;gap:4px;border:2px solid var(--kick);color:var(--kick);background:var(--paper);border-radius:999px;padding:2px 10px;font-weight:800;font-size:.85rem;transform:rotate(-2deg)}
.stamp-pick{display:flex;flex-direction:column;gap:6px}
.note.hl{outline:3px solid var(--accent-text);outline-offset:4px;border-radius:8px}
.cal-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.cal-head b{font-family:var(--display);font-size:1.05rem}
.cal-head button[disabled]{opacity:.35}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}
.cal-grid .wd{font-size:.7rem;font-weight:800;color:var(--muted)}
.cal-grid .cd{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:2.7em;min-width:0;border-radius:10px;font-size:.85rem;padding:2px 0;color:var(--muted)}
.cal-grid button.cd{border:1.5px solid var(--rule);background:var(--soft);color:var(--ink);font:inherit;font-size:.85rem;font-weight:800;cursor:pointer;margin:0}
.cal-grid .cd.today{box-shadow:inset 0 0 0 2px var(--accent-text)}
.cal-grid .cd i{display:flex;gap:3px;height:9px;align-items:center}
.mk{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent-text)}
.mk.k-match{background:var(--kick);border-radius:1px;transform:rotate(45deg)}
.mk.k-self{background:var(--good);border-radius:1px}
.cal-sum{margin:0}
.cal-key{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);margin:0}
.cal-key span{display:inline-flex;align-items:center;gap:5px}
.sklist .who{display:inline-block;font-size:.72rem;font-weight:800;border-radius:999px;padding:0 8px;margin-right:6px;background:var(--soft);color:var(--good)}
.swatch{width:40px;height:40px;padding:0;border-radius:50%;border:3px solid var(--rule)}
.swatch[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--ink)}
/* Where the player card is not pinned (a narrow or a low screen) it scrolls away while the settings are open, so the panel pins a small preview of the look to the top. */
.lookbar{display:none}
#settings{scroll-margin-top:calc(env(safe-area-inset-top,0px) + 12px)} /* opening the settings scrolls here; the heading stays clear of the status bar strip */
@media (max-width:759px),(max-height:569px){
  .lookbar{display:flex;align-items:center;gap:12px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:2;background:var(--soft);border:1px solid var(--rule);border-radius:14px;padding:6px 12px 6px 6px}
  .lookbar .ava{width:64px;height:72px}
}

/* notes list */
.note{border-top:1px solid var(--rule);padding-top:12px;display:flex;flex-direction:column;gap:6px}
.note:first-of-type{border-top:0;padding-top:0}
.note .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.note .date{font-weight:800}
.tag{display:inline-block;font-size:.72rem;font-weight:800;border-radius:999px;padding:1px 8px;background:var(--soft);color:var(--good);margin-left:6px}
.note .xp{font-weight:800;color:var(--kick);font-variant-numeric:tabular-nums}
.note .k{font-size:.75rem;color:var(--muted);font-weight:800;margin-right:6px}
.parent{background:var(--soft);border-radius:12px;padding:8px 12px;font-size:.92rem}
.empty{text-align:center;padding:20px 8px;display:flex;flex-direction:column;gap:10px;align-items:center}

/* team */
.bondnum{font-family:var(--display);color:var(--bond);font-size:1.4rem;margin-left:6px}
.pitch{background:linear-gradient(180deg,#2a8a4a,#1f6e3a);border-radius:14px;padding:14px 8px;display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden}
.pitch::before{content:"";position:absolute;left:50%;top:50%;width:76px;height:76px;border:2px solid rgba(255,255,255,.35);border-radius:50%;transform:translate(-50%,-50%)}
.pitch::after{content:"";position:absolute;left:0;right:0;top:50%;border-top:2px solid rgba(255,255,255,.35)}
.frow{display:flex;justify-content:space-around;position:relative;z-index:1}
.sidef{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.sidef .q2{font-weight:700;font-size:.9rem}
.sidef .q2 small{font-weight:400;color:var(--muted);margin-left:6px;font-size:.78rem}
.sidef .muted{margin:0}
/* the position badge keeps its words whole; on a phone it gets its own row, which can use the room kept free for the せってい button above it */

/* ---------- player picture ---------- */
// The player, the teammates and the item pictures are pixel pictures kept as rows of letters (PX above) and drawn by code.
// v20: the figures are fine pictures (a figure is about 150 squares tall). A figure is put together square by square, painted on a canvas
// and shown as an <image> inside the SVG; the small item pictures stay paths (one path per colour, crispEdges).
// The markup has no ids, so any number of pictures can sit on one page.
// The pictures were drawn for this page (2026-11) and turned into letters. In a picture, p gives a letter one fixed colour and
// t gives a letter a part and a tone: [part, tone], tone -1 (dark) .. 0 (the part's colour) .. 1 (light). Parts: h hair, s skin, e iris,
// j shirt, w trim, n shorts, k socks, b boots, a aura, p / q the ball's light and dark panels.
// The look choices in the settings. A saved profile keeps list positions, so these lists keep their order.
const HAIRS=[{n:"ツンツン"},{n:"みじかめ"},{n:"ながめ"},{n:"アップバング"}];
// Hair colours (c base, dk shade, hi light) and skin colours (c base, sh shade, dk dark). The settings show c.
const HAIRCOLORS=[
  {c:"#2c3264",dk:"#141836",hi:"#5a70c0"},{c:"#8a4a1a",dk:"#4e2808",hi:"#c47c3a"},{c:"#f4c43a",dk:"#b88412",hi:"#fce9a4"},{c:"#c42a1a",dk:"#741008",hi:"#f26a4a"},

];

// The hero's eyes change colour as the level goes up: dark, blue, glowing blue, purple, red, then red with gold light.
// c iris, hi bright colour, dk dark lower part. glow: the suit's light lines and bands shine; flare: a streak of light from one eye.
const EYES=[
  {lv:1,c:"#46506e",hi:"#8d9abb",dk:"#161c30",glow:0,flare:false},
  {lv:3,c:"#2f7bff",hi:"#9ad8ff",dk:"#0b2a78",glow:0,flare:false},
  {lv:6,c:"#1ea0ff",hi:"#c6f4ff",dk:"#0a3a9a",glow:1,flare:true},

];
const eyeOf=l=>EYES.filter(e=>l>=e.lv).pop();
const cmix=(a,b,t)=>"#"+[1,3,5].map(i=>{const x=parseInt(a.slice(i,i+2),16),y=parseInt(b.slice(i,i+2),16);return Math.round(x+(y-x)*t).toString(16).padStart(2,"0")}).join("");
const eyeFrom=c=>({c,hi:cmix(c,"#ffffff",.55),dk:cmix(c,"#000000",.6),glow:0,flare:false}); // teammates keep one eye colour
// One path per colour from a list of [x, y, colour] squares.
const pxRuns=cells=>{const by={};cells.forEach(([x,y,c])=>{(by[c]=by[c]||[]).push([x,y]);});
  return Object.keys(by).map(c=>{const ps=by[c];ps.sort((a,b)=>a[1]-b[1]||a[0]-b[0]);let d="",i=0;
    while(i<ps.length){let j=i;while(j+1<ps.length&&ps[j+1][1]===ps[i][1]&&ps[j+1][0]===ps[j][0]+1)j++;d+=`M${ps[i][0]} ${ps[i][1]}h${j-i+1}v1h-${j-i+1}z`;i=j+1;}
    return `<path fill="${c}" d="${d}"/>`;}).join("");};
// The squares of one small picture {r rows, p its fixed colours}, with role colours from pal.
const pxCells=(sp,pal,ox,oy)=>{const out=[];sp.r.forEach((r,y)=>{for(let x=0;x<r.length;x++){const ch=r[x];if(ch!==".")out.push([ox+x,oy+y,(pal&&pal[ch])||sp.p[ch]||"#0c0c14"]);}});return out;};
// pixSVG(o): o.level, color (team), number, hair, hairColor, skin, mood (fierce | grin | calm), gk, hero (captain band from Lv.12), fx (effects),
// sweat (after a loss), head / wrist (item colours), boots (item, or a made pair {t, c, ln, g, dk, sh, hi}), shin (a made pair of shin guards),
// ball (a made ball {t, c, ln, g, sh, hi}: tier t's pattern in its colours; none: the white ball), mate (a teammate's id: that teammate's own picture),

const pixSVG=(()=>{

  // the ball lies by the right foot; the rows above the head leave room for the aura and the crown.
  const OL="#07061f", W=124, H=200, BY=110, CX=58, BH=82;
  const hex=c=>typeof c==="string"&&/^#[0-9a-f]{6}$/i.test(c), mix=(a,b,t)=>hex(a)?cmix(a,b,t):a;
  const DIG={"0":["0110","1001","1001","1001","1001","1001","0110"],"1":["0010","0110","0010","0010","0010","0010","0111"],"2":["0110","1001","0001","0010","0100","1000","1111"],
    "3":["1110","0001","0001","0110","0001","0001","1110"],"4":["0010","0110","1010","1010","1111","0010","0010"],"5":["1111","1000","1110","0001","0001","1001","0110"],
    "6":["0110","1000","1000","1110","1001","1001","0110"],"7":["1111","0001","0010","0010","0100","0100","0100"],"8":["0110","1001","1001","0110","1001","1001","0110"],
    "9":["0110","1001","1001","0111","0001","0001","0110"]};
  const KNOT=["..oo....",".oaao...","oaaaao..","oadaao..",".oadao..",".oaddo..","..oado..","..oaao..","...oo..."];
  const STAR=["....g....","....g....","...ggg...","ggggggggg",".ggggggg.","..ggggg..","..ggggg..",".ggg.ggg.",".g.....g."];
  const RB=["#ff4a5a","#ff9a1f","#ffe033","#3ce06a","#3a9bff","#b36bff"];
  // a part's colour at a tone: f = {c, dk, hi}; skin has a middle shade
  const tone=(f,t)=>t>=0?mix(f.c,f.hi,t):mix(f.c,f.dk,-t);
  const skinTone=(sk,t)=>t>=0?mix(sk.c,"#ffffff",t*.5):t>=-.5?mix(sk.c,sk.sh,-t*2):mix(sk.sh,sk.dk,(-t-.5)*2);
  // every letter's colour for one picture: its fixed colours, and its parts in the colours given (a part without colours stays grey)
  const palOf=(sp,parts)=>{const p={};Object.keys(sp.p).forEach(k=>{p[k]=sp.p[k];});

// The がんばったこと picked most often (three times or more): something to be proud of, measured against nobody else.
function topChips(g){return Object.entries(g.chipCount||{}).filter(([id,c])=>c>=3&&Object.prototype.hasOwnProperty.call(CHIP,id)).sort((a,b)=>b[1]-a[1]).slice(0,2).map(([id,c])=>[CHIP[id].t,c]);}
async function setChal(t,quiet){
  t=String(t||"").trim().slice(0,40); if(!t){if(!quiet)flash("めあてを えらぶか、かいてね。");return false;}
  const before=curGoal();
  try{await store.setProfile({chal:{t,at:new Date().toISOString()}});}catch(e){if(!quiet)flash("ほぞんできませんでした。");return false;}
  followGoal(before,curGoal());
  chalOpen=false; render(); if(!quiet){const eb=$("#gcEdit"); if(eb)eb.focus();}
  return true; // v14: the reward's plan button shows 「ほぞんできませんでした。」 itself when this is false
}
// A note begun follows a new goal while its goal is still the one it was given and not yet marked done or not. A note that already
// says how its goal went was written after playing: it keeps its goal (that belongs to the practice it was played in), and the new
// goal becomes its next goal unless it has one of its own, so the pick is not lost when the note is saved. The same goes for a note
// kept in this browser and not opened yet.
function followGoal(before,t){
  if(before===t)return;
  const fit=d=>{if(!d.goalResult&&(!d.goal||d.goal===before)){d.goal=t;d.goalFrom=t;return true;}
    const n=typeof d.next==="string"?d.next.trim():""; if(n&&n!==before)return false; d.next=t; return true;};
  if(draft){if(fit(draft))keepDraft();return;}
  try{const k=JSON.parse(localStorage.getItem(DRAFT)||"null");
    if(k&&k.day===today()&&k.d&&typeof k.d==="object"&&fit(k.d))localStorage.setItem(DRAFT,JSON.stringify(k));}catch(e){}
}
/* ---------- v14 missions: どうが ふりかえり and しらべて まなぶ records (the logic; the cards and the forms draw from it) ---------- */
// The words typed in a mission form are kept on this device at every change ({day, video, learn, pro}, never in backups) and come back for a week.
const MDRAFT="soccer-note-mission-draft", MDRAFTDAYS=7; // a kept mission draft comes back for a week after it was last kept

let drawnDay="", mdDay=""; // v14: the day home was last drawn for (newDay); the day the drafts in memory were last kept or read (proTapsGo)
// Three topic hints a day, by date, never random (the same on every device that day).
const dayNo=d=>Math.floor(Date.parse(d+"T00:00:00Z")/864e5);
const hintsFor=d=>{const n=dayNo(d), L=LEARNHINTS.length; return [0,1,2].map(k=>LEARNHINTS[((n+k)%L+L)%L]);};
// v14 pro: three plays to look for in a pro match, by date (never random), from his own position in the settings (profile.pos and
// profile.side, through pointsOf): the role's points a viewer can see (PROSKIP left out), topped up from the position's own points, two
// of them a day, and one play without the ball; a keeper gets the keeper's three points; no position gets the three plays without the ball.
// Over three days a FW, MF or DF sees each of his three points. The card shows one of them (proCardLook); the form shows all three.
function proLooks(d){const n=dayNo(d), r=k=>((n+k)%3+3)%3, pos=POSKEYS.includes(profile.pos)?profile.pos:"";
  const pts=pos?[...new Set(pointsOf(pos,profile.side,TEAMSHAPE).concat(POSNOTE[pos].focus).filter(p=>!PROSKIP.includes(p[0])).map(p=>p[1]))].slice(0,3):[];
  if(pts.length<3)return [0,1,2].map(k=>PROOFF[r(k)]);
  return pos==="GK"?[0,1,2].map(k=>pts[r(k)]):[pts[r(0)],pts[r(1)],PROOFF[r(0)]];}
// v14 pro: the hint on the home card, which he reads before the match: the first, but one day in three (dayNo % 3 = 0) a FW, MF or DF
// sees the third, the play without the ball (「パスを もらう まえに うごく」). A keeper and no position keep the first,
// which already turns through all three.
const proCardLook=d=>{const l=proLooks(d); return (dayNo(d)%3+3)%3===0&&PROOFF.includes(l[2])&&!PROOFF.includes(l[0])?l[2]:l[0];};
// v14 pro: the name under the hints: the role of a MF or DF (サイドハーフ, センターハーフ, センターバック), else the position (フォワード,
// ゴールキーパー, ...). Never the side: on a TV picture a team's left is the far touchline when it attacks to the right, and it swaps at half time.
const proTitle=pos=>{const r=(pos==="MF"||pos==="DF")&&roleOf(pos,profile.side,TEAMSHAPE); return r?r.n:POS[pos]?POS[pos].n:"";};
// A new record's form: the newest match note of the last 3 days is picked for a video review; with no match notes the box for the match shows at once.
function newMission(kind){const base={id:uid(),kind,createdAt:"",next:""};
  if(kind==="learn")return Object.assign(base,{src:[],topic:"",learn:""});
  if(kind==="pro")return Object.assign(base,{how:"",match:"",look:"",wow:""});
  if(kind==="home")return Object.assign(base,{menu:[],mins:0,memo:""}); // v15 🏠
  const md=matchDays(), pre=md.length&&daysBetween(md[0].date,today())<=3?md[0].date:"";
  return Object.assign(base,{vdate:pre,vother:!md.length,vtext:"",good:"",fix:"",fun:0});}
// v14 (spec14_pro R16): taps alone in a 🌟 draft belong to the day they were kept, in memory too: on a later day, with its form closed,
// they go (as a reload already does); typed words keep the draft for its week. A form left open across midnight keeps its taps.
function proTapsGo(){const d=mdraft.pro; if(mdDay&&mdDay!==today()&&d&&missionOpen!=="pro"&&!(String(d.wow||"").trim()||String(d.next||"").trim()||String(d.match||"").trim()))mdraft.pro=null;
  const h=mdraft.home; if(mdDay&&mdDay!==today()&&h&&missionOpen!=="home"&&!String(h.memo||"").trim())mdraft.home=null;} // v15 🏠: taps alone belong to their day, as in 🌟
function keepMission(){proTapsGo(); mdDay=today(); try{localStorage.setItem(MDRAFT,JSON.stringify({day:today(),video:mdraft.video,learn:mdraft.learn,pro:mdraft.pro,home:mdraft.home}));}catch(e){}}
// Reads the kept words back as clean drafts (only known choices and texts of the lengths the forms allow), while 0-7 days old.
function keptMissions(){const out={video:null,learn:null,pro:null,home:null};
  try{const k=JSON.parse(localStorage.getItem(MDRAFT)||"null"), age=k&&isDay(k.day)?daysBetween(k.day,today()):-1; if(age<0||age>MDRAFTDAYS)return out;
    MKINDS.forEach(([kind])=>{const d=k[kind]; if(!d||typeof d!=="object"||typeof d.id!=="string"||!/^[a-z0-9]{1,24}$/.test(d.id))return;
      const s=(v,n)=>typeof v==="string"?v.slice(0,n):"", m=newMission(kind); m.id=d.id;
      m.createdAt=age?"":isoOr(d.createdAt,""); // kept from an earlier day: dated and counted on the day it is saved
      m.next=s(d.next,40);
      if(kind==="video"){m.vdate=isDay(d.vdate)&&d.vdate<=today()?d.vdate:""; m.vother=d.vother===true; m.vtext=s(d.vtext,20); m.good=s(d.good,300); m.fix=s(d.fix,200); m.fun=[1,2,3,4,5].includes(d.fun)?d.fun:0;}
      else if(kind==="pro"){m.how=PROHOW.some(c=>c[0]===d.how)?d.how:""; m.match=s(d.match,30); m.look=s(d.look,40); m.wow=s(d.wow,300);}
      else if(kind==="home"){m.menu=homeMenu(d); m.mins=homeMins(d.mins); m.memo=s(d.memo,60); const wz=wazaOf(d); if(wz.length)m.waza=wz;}
      else{m.src=(Array.isArray(d.src)?d.src:[]).filter((id,i,a)=>LEARNSRC.some(c=>c[0]===id)&&a.indexOf(id)===i); m.topic=s(d.topic,20); m.learn=s(d.learn,300);}
      if(kind==="pro"&&age&&!(m.wow.trim()||m.next.trim()||m.match.trim()))return; // v14 pro: taps alone come back the same day only
      if(kind==="home"&&age&&!m.memo.trim())return; // v15 🏠: the same
      out[kind]=m;});}catch(e){}
  return out;}
// The record as saved: dated from its save time on the writer's own clock (never picked), texts trimmed to the forms' lengths.
function missionOf(d,at){const day=localDay(Date.parse(at)), s=(v,n)=>String(v==null?"":v).trim().slice(0,n);
  const m={id:d.id,kind:d.kind,date:day,createdAt:at,next:s(d.next,40),parent:"",parentAt:"",stamps:[],stampAt:""};
  if(d.kind==="video"){m.good=s(d.good,300);m.fix=s(d.fix,200);m.fun=[1,2,3,4,5].includes(d.fun)?d.fun:0;m.vdate=isDay(d.vdate)&&d.vdate<=day?d.vdate:"";m.vtext=!m.vdate&&d.vother?s(d.vtext,20):"";}
  else if(d.kind==="pro"){m.how=PROHOW.some(c=>c[0]===d.how)?d.how:"";m.match=s(d.match,30);m.look=s(d.look,40);m.wow=s(d.wow,300);}
  else if(d.kind==="home"){m.menu=homeMenu(d);m.mins=homeMins(d.mins);m.memo=s(d.memo,60);const wz=wazaOf(d);if(wz.length)m.waza=wz;}
  else{m.src=(Array.isArray(d.src)?d.src:[]).filter((id,i,a)=>LEARNSRC.some(c=>c[0]===id)&&a.indexOf(id)===i);m.topic=s(d.topic,20);m.learn=s(d.learn,300);}

// Web addresses are not kept in a record (the app keeps no links); v14 pro: also the hosts of streaming and share links typed without a

const hasLink=v=>/(https?:|www\.|[a-z0-9-]+\.(com|jp|net|org|tv|be|me|io|ly)\b)/i.test(String(v||""));
// Whether a kind can still earn today: no other finished record of that kind on today's date (worked out on every render, so it opens again after midnight).
const missionLeft=(kind,id)=>!missions.some(m=>m.id!==id&&m.kind===kind&&mday(m)===today()&&missionDone(m));
// What to say when the record is not finished yet: [message, box to focus], or null when it is.
function missionWhy(m){

  if(m.kind==="home")return homeMenu(m).length||wazaOf(m).length?null:["やった あそびか わざを 1つ えらんでね。","mh-touch"]; // v15 🏠, v16
  if(m.kind==="pro")return written(m.wow)||written(m.next)?null:nchars(m.wow)?["「すごかった プレー」\u2060を もう すこし かいてね。","mp-wow"]
    :nchars(m.next)?["「まねしたい こと」\u2060を もう すこし かいてね。","mp-next"]:["「すごかった プレー」\u2060か 「まねしたい こと」\u2060を かいてね。 どちらか 1つで OK!","mp-wow"];
  if(m.kind==="learn")return written(m.learn)?null:nchars(m.learn)?["「まなんだ こと」\u2060を もう すこし かいてね。","ml-learn"]:["「まなんだ こと」\u2060を かいてね。 みじかくて OK!","ml-learn"];
  const bad=[["よかった ところ",m.good,"mv-good"],["なおしたい ところ",m.fix,"mv-fix"]].filter(x=>!written(x[1])); if(!bad.length)return null;
  const [t,v,id]=bad[0];
  if(nchars(v))return [`「${t}」\u2060を もう すこし かいてね。`,id];                                   // 1 character
  if(bad.length===2)return nchars(bad[1][1])?[`「${t}」\u2060を かいてね。`,id]:["「よかった ところ」\u2060と「なおしたい ところ」\u2060を かいてね。","mv-good"];
  return [id==="mv-fix"?"あと「なおしたい ところ」\u2060を かいたら ミッション クリア! 1つで OK だよ。":"あと「よかった ところ」\u2060を かいたら ミッション クリア!",id];}
// The 4 newest dates with a match note, today or earlier, newest first: {date, note (the newest that day), opp (opponents typed, in order)}.
function matchDays(){const by={}; entries.forEach(e=>{if(e&&e.kind==="match"&&isDay(e.date)&&e.date<=today())(by[e.date]=by[e.date]||[]).push(e);});
  return Object.keys(by).sort().reverse().slice(0,4).map(date=>{const es=sortEntries(by[date]), opp=[];

function stampNews(g){

// played or restored, so two saves never undo each other. After 10 s the sheet closes and the line says the save is still on its way.
const busyText=re=>re?"かえています…":"つくっています…";

function lineNote(k){return craftNote&&craftNote.k===k?craftNote.t:crafting&&crafting.slow&&crafting.k===k?stayText(crafting):"";}

// wait ("craft" or "bk") marks a message that asks to wait for that.
function craftSay(k,t,wait){
  craftNote={k,t,wait:wait||""}; clearTimeout(craftNoteT);
  craftNoteT=setTimeout(()=>{craftNote=null;LINES.forEach(L=>paintLine(L.k));},8000);
  LINES.forEach(L=>paintLine(L.k));

// Whether an element shows on the screen, above the tab bar at the bottom.

  catch(err){ok=false;

  // v14 banners, right under the number because they say why it is there: a mission cleared, juggling targets, a best, first counts.
  const jc=o.note?jugOf(o.note):{}, jn=k=>(JUGS.find(x=>x[0]===k)||["",""])[1], firsts=J.first.filter(k=>jc[k]>=1), bn=[];
  if(o.mk)bn.push(["msclear",o.mk==="video"?"<b>🎬 ミッション クリア!</b><span>じぶんの プレーを よく みたね!</span>":o.mk==="pro"?"<b>🌟 ミッション クリア!</b><span>プロの プレーを よく みたね!</span>":o.mk==="home"?"<b>🏠 ミッション クリア!</b><span>ボールと なかよく なったね!</span>":"<b>🔍 ミッション クリア!</b><span>あたらしい ことを まなんだね!</span>"]);
  if(J.clr.length)bn.push(["msclear","<b>⚽ ミッション クリア!</b>"+J.clr.map(([k,hit])=>{const nx=LADDER.find(x=>x>(jc[k]===undefined?Math.max.apply(null,hit):jc[k]));
    return `<span>${jn(k)} ${hit.join("かい・")}かい クリア! ${nx===undefined?"ぜんぶ クリア!":`つぎは ${nx}かい`}</span>`;}).join("")]);
  if(J.pb.length)bn.push(["pbest","<b>🏅 じこベスト!</b>"+J.pb.map(k=>`<span>${jn(k)} ${jc[k]}かい (まえは ${before.jug&&before.jug[k]?before.jug[k].n:0}かい)</span>`).join("")+firsts.map(k=>`<span>${jn(k)} ${jc[k]}かい (はじめての きろく)</span>`).join("")]);
  else if(firsts.length)bn.push(["pbest","<b>⚽ はじめての きろく!</b>"+firsts.map(k=>`<span>${jn(k)} ${jc[k]}かい</span>`).join("")]);
  // v14.1 the 7th, 14th, 30th, 50th and 100th day of a chain are celebrated (the 🔥 row in the list says the other days)
  if(o.par)bn.push(["parban","<b>👪 おうちの人と ふりかえり ボーナス!</b><span>いっしょに ふりかえったね!</span>"]); // v14.1 👪
  const S=gain.stk; if(S&&STREAKMARKS.includes(S.n))bn.push(["stkban",`<b>🔥 れんぞく ${S.n}日め!</b><span>すごい! ${S.n}日 つづけて かけたね!</span>`]);
  const banners=bn.map(([c,h],i)=>`<div class="${c}"${i?"":' id="ovban"'}>${h}</div>`).join("");
  // v14 the plan he wrote, with one tap to make it the goal on home
  const pl=written(o.plan)?String(o.plan).trim():"", plan=pl?`<div class="trygoal" id="ovplan"><span class="label">${o.mk==="learn"?"やってみたい こと":o.mk==="pro"?"まねしたい こと":"つぎに やってみる こと"}</span><b>${esc(pl)}</b>${pl===curGoal()?`<span class="muted">いまの めあてと おなじだね!</span>`:`<button class="ghost" id="ovgoal" type="button">これを めあてに する</button>`}</div>`:"";
  const ov=document.createElement("div"); ov.className="overlay";
  ov.innerHTML=`<div class="reward" role="dialog" aria-modal="true" aria-label="けっか" aria-describedby="ovbig${bn.length?" ovban":""}">
    <div class="big" id="ovbig">+${gain.sum} XP</div>${banners}
    ${lvup?`<div class="lvup">レベルアップ! Lv.${after.level}${after.level>=MAXLV?" MAX!":""}</div>${rankOf(after.level)!==rankOf(before.level)?`<div><b>「${rankOf(after.level)}」になった!</b></div>`:""}`:""}
    ${starUp?`<div class="lvup">★ ゲット! ★×${after.stars}</div>`:""}
    ${lvup||starUp?"":`<div class="muted">${after.level>=MAXLV?`MAX! つぎの ★まで あと ${toNext(after)} XP`:`つぎのレベルまで あと ${toNext(after)} XP`}</div>`}
    <ul>${gain.parts.map(p=>`<li${p[2]==="msn"||p[2]==="stk"?` class="${p[2]}"`:""}><span>${esc(p[0])}</span><b>+${p[1]}</b></li>`).join("")}</ul>${matGot}${plan}
    ${looks.length?`<div class="newmate"><div class="ava look">${pixSVG(Object.assign(heroOpts(after,equipNow()),{crop:lookCrop,label:heroName()}),"lk")}</div><div><b>あたらしい すがた!</b><br><span class="muted">${esc(looks.join("、"))}</span></div></div>`:""}
    ${newSkills.map(s=>`<div><span class="sk${s.lv===2?" gold":""}">${s.lv===2?"★ ":""}${esc(s.n)}</span> ${s.lv===2?"が ゴールドスキルに なった!":"を おぼえた!"}</div>`).join("")}
    ${newWaza.map(x=>`<div class="wzget"><span class="sk${x.lv===2?" gold":""}">${x.lv===2?"★ ":""}${x.n}</span> ${x.lv===2?"が ゴールドに なった!":"を おぼえた! しあいで つかえるよ!"}</div>`).join("")}
    ${newMates.map(m=>`<div class="newmate"><div class="ava">${pixSVG(mateOpts(m),"n"+m.id)}</div><div><b>${esc(m.n)}(${m.pos})が なかまに なった!</b><br><span class="muted">${esc(m.cat)}</span><br><button class="ghost mini" type="button" data-ovmname="${m.id}" style="margin:6px 0 0">なまえを かえる</button></div></div>`).join("")}
    ${ticket?`<div><b>しあいチケット +1</b> <span class="muted">(いま ${tickets(after)}まい)</span></div>`:""}
    ${newMake.length?`<div class="craft-ask"><b>🔨 ${esc(GEAR[newMake[0]].n)}${newMake.length>1?" など":""}が つくれるよ!</b><button class="ghost" type="button" id="ovcraft">こうぼうへ</button></div>`:""}
    ${handoff?`<div class="handoff-ask"><b>${o.mk==="learn"?"👪 おうちの人に おしえて あげよう!":o.mk==="pro"?"👪 みた プレーを おうちの人と はなそう!":o.mk==="home"?"👪 やった あそびを おうちの人に はなそう!":o.mk==="video"&&vparOpen(after,handoff)?`👪 おうちの人と いっしょに ふりかえろう! コメントで +${VIDEOPARENT}\u00a0XP`:"👪 つぎは おうちの人の ばん!"}</b><button class="ghost" type="button" id="ovpar">おうちの人に わたす</button></div>`:""}
    <div class="row" style="justify-content:center">${ticket?`<button class="ghost" type="button" id="ovmatch">しあいに いく</button>`:""}<button class="primary" type="button" id="ovok" style="flex:1">やったね!</button></div></div>`;
  document.body.appendChild(ov);
  // The second tap of a double tap on the save button lands on the reward, so for half a second it ignores taps: it must not vanish before it has been seen.
  // v14: やったね! (or a tap beside the reward) goes back to the card of what was cleared, when it is on screen
  const born=Date.now(), early=()=>Date.now()-born<500, close=f=>{ov.remove(); const el=f&&o.focus&&document.querySelector(o.focus); if(el)el.focus();};
  ov.querySelector("#ovok").addEventListener("click",()=>{if(!early())close(true);});
  const gb=ov.querySelector("#ovgoal"); let gBusy=false;
  if(gb)gb.addEventListener("click",async()=>{if(early()||gBusy||gb.getAttribute("aria-disabled")==="true")return; gBusy=true; const ok=await setChal(pl,true); gBusy=false;
    if(ok){gb.textContent="✓ めあてに したよ"; gb.setAttribute("aria-disabled","true"); say("めあてに したよ! 「せんしゅ」で みられるよ");}
    else{const n=document.createElement("span"); n.className="muted"; n.textContent="ほぞんできませんでした。"; gb.replaceWith(n); say("ほぞんできませんでした。"); const k=ov.querySelector("#ovok"); if(k)k.focus({preventScroll:true});}});
  const mb=ov.querySelector("#ovmatch"); if(mb)mb.addEventListener("click",()=>{if(early())return;close();go("match");});
  const pb=ov.querySelector("#ovpar"); if(pb)pb.addEventListener("click",()=>{if(early())return;close();openParent(handoff);});
  const cb=ov.querySelector("#ovcraft"); if(cb)cb.addEventListener("click",()=>{if(early())return;close();toCraft();});
  ov.querySelectorAll("[data-ovmname]").forEach(x=>x.addEventListener("click",()=>{if(early())return;close();go("team");mateEdit=x.dataset.ovmname;render();const f=$("#mn-in");if(f){f.focus();try{f.select();}catch(err){}}}));
  ov.addEventListener("click",ev=>{if(ev.target===ov&&!early())close(true)});
  // A reward that does not fit (a level up with new looks and teammates) keeps the parents' ask (v14.1): the button row is sticky at
  // the reward's bottom, so やったね! stays whole on its first screen; the reward opens at its top.
  const rw=ov.querySelector(".reward");
  ov.querySelector("#ovok").focus({preventScroll:true}); rw.scrollTop=0;
}

/* ---------- boot ---------- */
mdraft=keptMissions(); mdDay=today(); // v14: mission words kept on this device come back (for a week)
render();
function goLocal(){if(mode!=="loading")return;mode="local";lsLoad();msLoad();msReady=true;profReady=gameReady=true;render();}
const use=window.claude&&window.claude.use?window.claude.use("db"):Promise.resolve(null);
Promise.resolve(use).then(d=>{
  if(!d){goLocal();return;}
  db=d;
  const timer=setTimeout(()=>{if(mode==="loading"){mode="slow";render();}},10000);
  db.collection("entries").onSnapshot(snap=>{clearTimeout(timer);mode="db";entries=snap.docs.map(x=>Object.assign({id:x.id},x.data()));render();},
    err=>{clearTimeout(timer);mode="error";render();});
  msListen(); // v14: the mission records, apart from the notes (a failure there never sets mode)
  db.doc("profile/main").onSnapshot(s=>{const was=profReady&&loaded(), before=was?curGoal():null; profReady=true;if(s.exists){const d=s.data()||{};profile=cleanProfile(Object.assign({},profile,d,{mnames:d.mnames}));}if(was)followGoal(before,curGoal());if(was)freshDraft();render();},()=>{profReady=true;render();});
  // Skip echoes of our own writes while one is queued or a match is being played back: the local state is already ahead.
  db.doc("game/main").onSnapshot(s=>{if(gameBusy||(live&&!live.done))return;gameReady=true;if(s.exists){game=Object.assign(newGame(),s.data());game.made=cleanMade(game.made);}render();},()=>{});
}).catch(()=>{goLocal();});
if(window.claude&&window.claude.use){
  Promise.resolve(window.claude.use("dictation")).then(d=>{dictReady=true;if(d)wireDictation(d);render();}).catch(()=>{dictReady=true;render();});
}else{dictReady=true;}
})();
</script>
